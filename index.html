<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Headphones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --text:#111111;
    --muted:#767676;
    --blue:#1155CC;
    --red:#D93025;
    --hairline:#e6e6e6;
    --serif:'Young Serif', serif;
    --mono:'Source Code Pro', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    font-weight:400;
    min-height:100vh;
  }
  a{color:inherit;}

  header.site{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:24px 40px;
  }
  header.site .brand{font-family:var(--serif); font-size:20px; font-weight:400;}
  nav.tabs{display:flex; gap:24px;}
  nav.tabs button{
    font-family:var(--serif); font-size:15px; font-weight:400;
    background:none; border:none; cursor:pointer; color:var(--muted);
    padding:4px 0;
  }
  nav.tabs button.active{color:var(--text);}

  main{max-width:1180px; margin:0 auto; padding:10px 40px 80px;}

  .headline{font-family:var(--serif); font-size:24px; font-weight:400; line-height:1.45; margin:0 0 22px; max-width:640px;}
  .phrase-link{color:var(--blue); text-decoration:none;}
  .phrase-link:hover{color:var(--red);}

  /* ---------- MAP VIEW ---------- */
  .map-wrap{display:grid; grid-template-columns:1fr 280px; gap:36px; align-items:start;}
  .map-frame{height:560px; position:relative;}
  #leafletMap{width:100%; height:100%;}

  .side-list{display:flex; flex-direction:column; height:560px;}
  .side-list-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex:0 0 auto;}
  .sort-select{font-family:var(--mono); font-size:12px; color:var(--muted); border:none; background:transparent; cursor:pointer;}
  .sort-select:focus{outline:none;}
  .side-list-items{overflow-y:auto; flex:1; min-height:0; padding-right:6px;}
  .side-item{padding:12px 0; cursor:pointer; border-bottom:1px solid var(--hairline);}
  .side-item:first-child{padding-top:0;}
  .side-item .phrase-text{color:var(--blue); font-size:15px;}
  .side-item:hover .phrase-text{color:var(--red);}
  .side-item .meta{display:block; font-size:12px; color:var(--muted); margin-top:4px;}
  .side-item .meta.no-loc{font-style:italic;}

  .leaflet-popup-content-wrapper{border-radius:2px; box-shadow:0 1px 4px rgba(0,0,0,0.2);}
  .leaflet-popup-content{font-family:var(--mono); font-size:13px; margin:10px 12px; color:var(--text);}
  .leaflet-popup-content .loc{display:block; font-size:11px; color:var(--muted); margin-top:6px;}
  .leaflet-popup-content a.readlink{display:inline-block; margin-top:8px; font-size:12px; color:var(--blue); text-decoration:none;}
  .leaflet-popup-content a.readlink:hover{color:var(--red);}

  /* ---------- STORY VIEW ---------- */
  .story-wrap{display:grid; grid-template-columns:220px 1fr 240px; gap:36px; align-items:start;}

  .story-list-col{max-height:600px; display:flex; flex-direction:column;}
  .story-list-scroll{overflow-y:auto; flex:1; max-height:180px;}
  .story-card{padding:10px 0; cursor:pointer; font-family:var(--serif); font-size:15px; color:var(--muted);}
  .story-card.active{color:var(--text);}

  .story-page{min-height:420px;}
  .story-nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:26px;}
  .story-nav button{font-family:var(--serif); font-size:14px; background:none; border:none; cursor:pointer; color:var(--blue); padding:0;}
  .story-nav button:hover:not(:disabled){color:var(--red);}
  .story-nav button:disabled{opacity:0.3; cursor:default; color:var(--muted);}
  .story-nav .counter{font-family:var(--mono); font-size:12px; color:var(--muted);}

  .story-page h3{font-family:var(--serif); font-size:26px; font-weight:400; margin:0 0 22px;}
  .story-page p{line-height:1.75; font-size:16px; margin:0 0 18px; font-weight:300;}
  .phrase{color:var(--blue); text-decoration:none; cursor:pointer;}
  .phrase:hover, .phrase.pulse{color:var(--red);}

  .empty-stories{padding:40px 0; color:var(--muted); font-family:var(--serif); font-size:17px; max-width:44ch; line-height:1.6;}

  .mini-map-box{position:sticky; top:20px;}
  .mini-map-box h4{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin:0 0 12px;}
  .mini-map{height:220px; position:relative;}
  #miniLeaflet{width:100%; height:100%;}
  .mini-hint{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:12px; line-height:1.5;}

  .about-page{max-width:600px;}
  .about-page p{line-height:1.75; font-size:16px; margin:0 0 18px; font-weight:300;}

  @media (max-width:900px){
    .map-wrap, .story-wrap{grid-template-columns:1fr;}
    .side-list{height:360px; padding-top:20px; margin-top:20px;}
    .mini-map-box{position:static;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="brand">No Headphones</div>
  <nav class="tabs" id="mainNav">
    <button data-view="map" class="active">Map</button>
    <button data-view="stories">Stories</button>
    <button data-view="about">About</button>
  </nav>
</header>

<main>
  <div id="viewport"></div>
</main>

<script>
/* ---------------- DATA ----------------
   Real lat/lng. `region` is a light tag so a future "everywhere" filter
   is just: phrases.filter(p => region === 'all' || p.region === region).
   `loc` is left blank until filled in by hand. A few entries have no
   GPS (iOS strips it on web upload) or no text (caption wasn't
   captured) — the map/list below are built to tolerate both. */

const phrases = [
  { id:'ppoza0', text:"I had a really weird first date on 9/11, by the way", lat:40.730830555555556, lng:-74.00125, loc:"", date:"2026-09-18", storyId:'s1', region:'nyc' },
  { id:'ppoza1', text:"They can also live in the grass?", lat:40.65750555555555, lng:-73.96492777777777, loc:"", date:"2026-08-12", storyId:null, region:'nyc' },
  { id:'ppoza2', text:"E47 is the gate that you need to go to", lat:40.654475, lng:-73.9640888888889, loc:"", date:"2026-08-12", storyId:null, region:'nyc' },
  { id:'ppoza3', text:"That’s not yellow, that’s red", lat:40.65546666666666, lng:-73.96331111111111, loc:"", date:"2026-08-12", storyId:null, region:'nyc' },
  { id:'ppoza4', text:"My editor got fired after he tried to make me resign", lat:40.68443611111111, lng:-73.94415277777779, loc:"", date:"2025-05-03", storyId:'s2', region:'nyc' },
  { id:'ppoza5', text:"everyone thinks about things differently", lat:40.709744444444446, lng:-73.94371111111111, loc:"", date:"2025-05-03", storyId:null, region:'nyc' },
  { id:'ppoza6', text:"When I went there a few years ago they had shitty-ass clothes", lat:40.72855833333333, lng:-73.9847861111111, loc:"", date:"2025-05-03", storyId:null, region:'nyc' },
  { id:'ppoza7', text:"I feel like everything only counts post-Covid", lat:40.73063333333334, lng:-73.99607222222222, loc:"", date:"2025-05-02", storyId:null, region:'nyc' },
  { id:'ppoza8', text:"It’s New York City, man. They don’t care", lat:40.73464722222222, lng:-73.99208888888889, loc:"", date:"2025-05-02", storyId:null, region:'nyc' },
  { id:'ppoza10', text:"And then last night, he asked to borrow my car for Ohio.", lat:40.725569444444446, lng:-73.95165277777778, loc:"", date:"2025-05-02", storyId:'s1', region:'nyc' },
  { id:'ppoza11', text:"I said, 'That’s your mindset.' I’m not turning my back on somebody because they’re asking me for help.", lat:40.68994166666666, lng:-73.94232222222223, loc:"", date:"2025-05-02", storyId:null, region:'nyc' },
  { id:'ppoza12', text:"had a key to, like, open it", lat:40.735711111111115, lng:-73.99010555555556, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza13', text:"And on top of that, look at how he’s treating Natalie! Look at how he’s treating Ashley! The two people that were there for him for mad long.", lat:40.73653888888889, lng:-73.98923611111111, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza14', text:"That bitch ate everything, like every fucking thing", lat:40.737636111111115, lng:-73.98820555555555, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza15', text:"What do you see happening? Big picture, obviously", lat:40.73876111111111, lng:-73.98538888888889, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza16', text:"I think I said something weird, maybe. “What did you say?” I don’t remember.", lat:40.741619444444446, lng:-73.98339722222222, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza17', text:"She’s dumb, honey", lat:40.74090277777778, lng:-73.98135277777779, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza19', text:"Let’s say it’s like 6 units and we can fit 12 units", lat:40.74075833333333, lng:-73.98175833333333, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza20', text:"So I have questions for you. “Great! I hope I have answers for you”", lat:40.744975000000004, lng:-73.988975, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza21', text:"She lives in the city. I didn’t know that", lat:40.745736111111114, lng:-73.98831111111112, loc:"", date:"2025-05-01", storyId:null, region:'nyc' },
  { id:'ppoza22', text:"Like, I literally don’t care", lat:40.74943611111111, lng:-73.98776111111111, loc:"", date:"2025-05-01", storyId:'s2', region:'nyc' },
  { id:'ppoza23', text:"'I wish you'd met me before I was like this so you would've known the person that I am.' 'We meet people when we're supposed to meet them.'", lat:40.7130272, lng:-74.0034742, loc:"", date:"2026-07-09", storyId:null, region:'nyc' },
];

const stories = [
  { id:'s1', title:"9/11", paragraphs:[
    [ {phrase:'ppoza0'}, ". He told me he'd met me in a dream and then asked if I minded paying for dinner." ],
    [ {phrase:'ppoza10'}, " He said that’s where his paychecks have been coming in the mail." ]
  ]},
  { id:'s2', title:"Fired", paragraphs:[
    [ {phrase:'ppoza4'}, ". And now he’s trying to get me to talk them out of it. After what he pulled, I have no idea why he thinks I would do that." ],
    [ {phrase:'ppoza22'}, " that he’s gone." ]
  ]}
];

/* ---------------- STATE ---------------- */
const VALID_VIEWS = ['map','stories','about'];
function viewFromHash(){
  const v = location.hash.replace('#','');
  return VALID_VIEWS.includes(v) ? v : 'map';
}
let currentView = viewFromHash();
let selectedStoryId = stories.length ? stories[0].id : null;
let bigMap = null, miniMap = null;

const viewport = document.getElementById('viewport');
const HEADLINE = `<p class="headline">I document <a href="#map" class="phrase-link">what I overhear</a> people saying around New York City and then imagine them <a href="#stories" class="phrase-link">talking to each other</a> across time and space.</p>`;
const navButtons = document.querySelectorAll('#mainNav button');
navButtons.forEach(b=>b.addEventListener('click', ()=>{
  location.hash = b.dataset.view;
}));

window.addEventListener('hashchange', ()=>{
  currentView = viewFromHash();
  navButtons.forEach(x=>x.classList.toggle('active', x.dataset.view===currentView));
  render();
});

function pinDivIcon(faint=false){
  const color = faint ? '#cfcfcf' : '#1155CC';
  return L.divIcon({
    className:'',
    html:`<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="${color}" stroke="#fff" stroke-width="1.5"/></svg>`,
    iconSize:[14,14], iconAnchor:[7,7]
  });
}

function hasCoords(p){
  return typeof p.lat === 'number' && typeof p.lng === 'number';
}

/* ---------------- RENDER: MAP VIEW ---------------- */
let phraseSort = 'date-desc';

function sortedPhrases(){
  const list = [...phrases];
  if(phraseSort === 'date-desc') list.sort((a,b)=> new Date(b.date) - new Date(a.date));
  else if(phraseSort === 'date-asc') list.sort((a,b)=> new Date(a.date) - new Date(b.date));
  else if(phraseSort === 'alpha') list.sort((a,b)=> a.text.localeCompare(b.text));
  return list;
}

function renderMapView(){
  viewport.innerHTML = `
    ${HEADLINE}
    <div class="map-wrap">
      <div class="map-frame"><div id="leafletMap"></div></div>
      <div class="side-list">
        <div class="side-list-head">
          <select class="sort-select" id="sortSelect">
            <option value="date-desc" ${phraseSort==='date-desc'?'selected':''}>Newest first</option>
            <option value="date-asc" ${phraseSort==='date-asc'?'selected':''}>Oldest first</option>
            <option value="alpha" ${phraseSort==='alpha'?'selected':''}>A–Z</option>
          </select>
        </div>
        <div class="side-list-items">
          ${sortedPhrases().map(p=>{
            const metaText = [p.loc, p.date].filter(Boolean).join(' · ') || 'no location yet';
            const noLoc = hasCoords(p) ? '' : ' no-loc';
            return `
            <div class="side-item" data-id="${p.id}">
              <span class="phrase-text">${p.text || '(untitled)'}</span>
              <span class="meta${noLoc}">${metaText}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;

  document.getElementById('sortSelect').addEventListener('change', (e)=>{
    phraseSort = e.target.value;
    renderMapView();
  });

  if(bigMap){ bigMap.remove(); bigMap=null; }
  bigMap = L.map('leafletMap', { scrollWheelZoom:true }).setView([40.735,-73.995], 12.5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19
  }).addTo(bigMap);
  setTimeout(()=> bigMap.invalidateSize(), 150);

  const markers = {};
  phrases.forEach(p=>{
    if(!hasCoords(p)) return; // no GPS on this one — still listed on the side, just not on the map
    const m = L.marker([p.lat,p.lng], {icon:pinDivIcon()}).addTo(bigMap);
    m.bindTooltip(p.text || '(untitled)', {direction:'top', offset:[0,-8]});
    m.bindPopup(`${p.text || '(untitled)'}<span class="loc">${[p.loc, p.date].filter(Boolean).join(' — ')}</span>${p.storyId ? `<br><a class="readlink" href="#" data-id="${p.id}">Read the story →</a>` : ''}`);
    m.on('popupopen', ()=>{
      document.querySelector(`.leaflet-popup-content a[data-id="${p.id}"]`)
        ?.addEventListener('click', (e)=>{ e.preventDefault(); goToStory(p.storyId, p.id); });
    });
    markers[p.id]=m;
  });

  viewport.querySelectorAll('.side-item').forEach(item=>{
    const p = phrases.find(x=>x.id===item.dataset.id);
    if(p.storyId) item.addEventListener('click', ()=> goToStory(p.storyId, p.id));
    else item.style.cursor = 'default';
    item.addEventListener('mouseenter', ()=>{
      const m = markers[p.id];
      if(!m) return;
      bigMap.panTo([p.lat,p.lng]); m.openTooltip();
    });
    item.addEventListener('mouseleave', ()=> markers[p.id]?.closeTooltip());
  });
}

function goToStory(storyId, pulsePhraseId){
  if(!storyId) return;
  selectedStoryId=storyId;
  if(viewFromHash()!=='stories'){
    location.hash = 'stories'; // hashchange listener sets currentView, updates nav, and calls render()
  } else {
    currentView='stories';
    render();
  }
  if(pulsePhraseId){
    requestAnimationFrame(()=>{
      const el = document.querySelector(`.phrase[data-id="${pulsePhraseId}"]`);
      if(el){ el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.add('pulse'); setTimeout(()=>el.classList.remove('pulse'),2500); }
    });
  }
}

/* ---------------- RENDER: STORY VIEW ---------------- */
function renderStoryView(){
  if(!stories.length){
    viewport.innerHTML = `${HEADLINE}<p class="empty-stories">No stories yet. Check back once the first is written.</p>`;
    return;
  }

  const idx = stories.findIndex(s=>s.id===selectedStoryId);
  const story = stories[idx] || stories[0];
  const storyPhraseIds = phrases.filter(p=>p.storyId===story.id).map(p=>p.id);

  viewport.innerHTML = `
    ${HEADLINE}
    <div class="story-wrap">
      <div class="story-list-col">
        <div class="story-list-scroll">
          ${stories.map(s=>`
            <div class="story-card ${s.id===story.id?'active':''}" data-id="${s.id}">${s.title}</div>`).join('')}
        </div>
      </div>

      <div class="story-page">
        <div class="story-nav">
          <button id="prevStory" ${idx<=0?'disabled':''}>&larr; Prev</button>
          <span class="counter">${idx+1} / ${stories.length}</span>
          <button id="nextStory" ${idx>=stories.length-1?'disabled':''}>Next &rarr;</button>
        </div>
        <h3>${story.title}</h3>
        <p>${story.paragraphs.map(para=>para.map(chunk=>{
          if(typeof chunk === 'string') return chunk;
          const p = phrases.find(x=>x.id===chunk.phrase);
          return `<span class="phrase" data-id="${p.id}">${p.text}</span>`;
        }).join('')).join(' ')}</p>
      </div>

      <div class="mini-map-box">
        <h4>Where these were heard</h4>
        <div class="mini-map"><div id="miniLeaflet"></div></div>
        <p class="mini-hint">Hover a phrase in the story to see where it was overheard.</p>
      </div>
    </div>`;

  viewport.querySelectorAll('.story-card').forEach(c=>{
    c.addEventListener('click', ()=>{ selectedStoryId=c.dataset.id; renderStoryView(); });
  });
  document.getElementById('prevStory')?.addEventListener('click', ()=>{ if(idx>0){ selectedStoryId=stories[idx-1].id; renderStoryView(); }});
  document.getElementById('nextStory')?.addEventListener('click', ()=>{ if(idx<stories.length-1){ selectedStoryId=stories[idx+1].id; renderStoryView(); }});

  if(miniMap){ miniMap.remove(); miniMap=null; }
  miniMap = L.map('miniLeaflet', { zoomControl:false, scrollWheelZoom:false, dragging:true }).setView([40.735,-73.995], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap contributors', maxZoom:19 }).addTo(miniMap);
  setTimeout(()=> miniMap.invalidateSize(), 150);

  const miniMarkers = {};
  const bounds = [];
  phrases.forEach(p=>{
    if(!hasCoords(p)) return;
    const faint = !storyPhraseIds.includes(p.id);
    const m = L.marker([p.lat,p.lng], {icon:pinDivIcon(faint)}).addTo(miniMap);
    miniMarkers[p.id]=m;
    if(!faint) bounds.push([p.lat,p.lng]);
  });
  if(bounds.length) setTimeout(()=> miniMap.fitBounds(bounds, {padding:[30,30], maxZoom:14}), 160);

  viewport.querySelectorAll('.phrase').forEach(el=>{
    const id = el.dataset.id;
    const m = miniMarkers[id];
    if(!m) return;
    el.addEventListener('mouseenter', ()=>{ miniMap.panTo(m.getLatLng()); m.openTooltip(); });
    el.addEventListener('mouseleave', ()=> m.closeTooltip());
    el.addEventListener('click', ()=>{ el.classList.add('pulse'); setTimeout(()=>el.classList.remove('pulse'),2000); });
    m.bindTooltip(phrases.find(x=>x.id===id).loc || phrases.find(x=>x.id===id).text, {direction:'top', offset:[0,-8]});
  });
}

/* ---------------- RENDER: ABOUT ---------------- */
function renderAboutView(){
  viewport.innerHTML = `
    <div class="about-page">
      <p>When I'm walking somewhere or waiting around, I'm often tempted to check my phone or put my earphones in and <a href="https://haleynahman.substack.com/p/148-too-much-music" target="_blank" rel="noopener">soundtrack my life</a> like I'm the main character.</p>
      <p>If I'm able to resist those impulses, I'm always rewarded by the things I notice. I become more attuned to the conversations people are having around me, and in a weird way, feel more connected to them.</p>
      <p>I'm usually only around them long enough to catch a snippet — sometimes as little as a couple words or a phrase. But it's almost more fun that way, to wonder about the context. This is my attempt at filling in the blanks, and in doing so, putting people who've never met in conversation with each other.</p>
      <p>It's an exercise in being present and observing intently. It's also my love letter to New York, a city that makes it easy to talk to strangers, and one that's a dream to live in for nosy people like me.</p>
    </div>`;
}

/* ---------------- ROUTER ---------------- */
function render(){
  if(currentView==='map') renderMapView();
  else if(currentView==='stories') renderStoryView();
  else renderAboutView();
}
navButtons.forEach(x=>x.classList.toggle('active', x.dataset.view===currentView));
if(!location.hash) location.hash = currentView;
render();
</script>
</body>
</html>
